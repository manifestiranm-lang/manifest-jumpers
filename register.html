<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a100d">
<title>Manifest</title>
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero">
  <div class="lang" role="group" aria-label="Language"><button type="button" data-l="fa">فارسی</button><button type="button" data-l="en">English</button></div>
  <div class="hero-in"><img src="logo.png" alt=""><div class="hero-t"><b class="brand">Manifest</b><h1 id="title"></h1><p id="tag"></p></div></div>
</header>
<main class="wrap">
  <p style="margin:0 0 10px"><a href="./" class="tologin">← ورود / Sign in</a></p>
  <div class="note-card" id="intro"></div>
  <form id="form" novalidate autocomplete="off">
    <div class="hp"><label>Website <input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
    <div id="fields" class="fx"></div>
    <div class="err" id="err" role="alert"></div>
    <button class="submit" id="send" type="submit"></button>
  </form>
  <div class="done" id="done" style="display:none"></div>
</main>
<div id="scrim" class="scrim" hidden></div>
<div id="pop" class="pop" hidden></div>
<script src="config.js"></script>
<script src="models.js"></script>
<script src="app.js"></script>
<script>
(function(){var n=10,i=Math.floor(Math.random()*n),box=document.createElement("div");box.id="bgs";box.setAttribute("aria-hidden","true");
for(var k=1;k<=n;k++){var e=document.createElement("i");e.setAttribute("data-s","hero/q"+k+".webp");box.appendChild(e)}
document.body.insertBefore(box,document.body.firstChild);
function show(){var els=box.children;[i,(i+1)%n].forEach(function(x){if(!els[x].style.backgroundImage)els[x].style.backgroundImage='url("'+els[x].getAttribute("data-s")+'")'});for(var j=0;j<n;j++){if(j===i){els[j].classList.remove("lv");els[j].classList.add("on")}else if(els[j].classList.contains("on")){els[j].classList.remove("on");els[j].classList.add("lv");(function(x){setTimeout(function(){x.classList.remove("lv")},2900)})(els[j])}}}
show();setInterval(function(){i=(i+1)%n;show()},7000)})();
</script>
<script>
(function(){if(!("IntersectionObserver" in window))return;var f=document.getElementById("fields");var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}})},{threshold:.06});
function scan(){if(f.classList.contains("fx"))return;f.querySelectorAll(".sec:not(.rv)").forEach(function(el){el.classList.add("rv");io.observe(el)})}
new MutationObserver(scan).observe(f,{childList:true});setTimeout(scan,1600);})();
</script>
</body>
</html>
